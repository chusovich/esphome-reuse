sensor:
  - platform: ntc
    name: ${sensor_name_}
    id: ntc_sensor_${sensor_id}
    sensor: resistance_sensor
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 10kOhm
  - platform: resistance
    id: resistance_sensor_${sensor_id}
    sensor: adc_sensor
    configuration: DOWNSTREAM
    resistor: 10kOhm
    name: Resistance Sensor
  - platform: adc
    id: adc_sensor_${sensor_id}
    pin: ${adc_pin}
