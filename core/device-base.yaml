# Home Assistant API
api:
  encryption:
    key: ${api_key}
  reboot_timeout: 15min

# OTA Updates
ota:
  - platform: esphome
    encryption:

# Web Server
web_server:
  version: 3
  port: 80
  auth:
    username: ${web_server_username}
    password: ${web_server_password}

# Prometheus Exporter
prometheus:

# Uptime Sensor
sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s
    entity_category: diagnostic

# Connection Status
binary_sensor:
  - platform: status
    name: "Connection Status"
    entity_category: diagnostic

# Firmware Version
text_sensor:
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    entity_category: diagnostic
