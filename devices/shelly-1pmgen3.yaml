esphome:
  name: ${device_name}
  comment: "Shelly 1PM Gen3"

esp32:
  variant: esp32c3

logger:
  level: ${log_level}
  hardware_uart: uart0

status_led:
  pin:
    number: GPIO0
    inverted: true
    
uart:
  id: bl0942_uart
  tx_pin: GPIO6
  rx_pin:
    number: GPIO7
    mode:
      pullup: true
      input: true
  baud_rate: 9600
  stop_bits: 1

switch:
  - id: relay
    name: "Relay"
    platform: gpio
    pin: GPIO4
    # use internal to keep it from being exposed to home assistant
    internal: true

binary_sensor:
  - platform: template
    name: "Relay Status"
    icon: "mdi:electric-switch"
    lambda: |-
      if (id(relay).state == 1) {
        // Relay is closed.
        return true;
      } else {
        // Relay is open.
        return false;
      }
  - id: wall_switch
    name: "Wall Switch"
    platform: gpio
    pin: GPIO10
    filters:
      - delayed_off: 50ms       
  - id: onboard_button
    name: "Onboard Button"
    platform: gpio
    pin: 
      number: GPIO1
      inverted: true
    filters:
      - delayed_off: 50ms

sensor:
  - id: temperature
    name: Temperature
    platform: ntc
    sensor: temperature_sensor_resistance
    icon: mdi:thermometer
    entity_category: diagnostic
    unit_of_measurement: °C
    accuracy_decimals: 1
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 25°C
  - id: temperature_sensor_resistance
    platform: resistance
    sensor: temperature_sensor_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
  - id: temperature_sensor_voltage
    platform: adc
    pin: GPIO3
    attenuation: 12db
  - platform: bl0942
    uart_id: bl0942_uart
    line_frequency: 60Hz
    update_interval: 1s
    # voltage_reference: # Recommend calibrating the voltage sensor for accurate power/energy readings.
    # current_reference: # Current sensor must be calibrated for the safety shutdown to respond correctly!
    voltage:
      name: Voltage
      id: sensor_voltage
    current:
      name: Current
      id: sensor_current
    power:
      name: Power
      id: sensor_power
    frequency:
      name: Frequency
      id: sensor_frequency
      accuracy_decimals: 2
    energy:
      name: Energy
      id: sensor_energy
      entity_category: diagnostic
      device_class: energy
      state_class: total_increasing
      accuracy_decimals: 3
