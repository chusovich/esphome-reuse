esp32:
  variant: ESP32C3
  board: esp32-c3-devkitm-1
  flash_size: 8MB
  flash_mode: dio
  partitions: support/partitions/shelly-pmmini-gen3.csv
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_PARTITION_TABLE_OFFSET: "0xf000"
    advanced:
      enable_ota_rollback: false

ota:
  - platform: esphome
    allow_partition_access: true

uart:
  id: uart_0
  tx_pin: GPIO6
  rx_pin:
    number: GPIO7
    mode:
      pullup: true
      input: true
  baud_rate: 9600
  stop_bits: 1

binary_sensor:
  - platform: gpio
    id: button
    name: "Button"
    pin:
      number: 1
      inverted: yes
      mode:
        input: true
        pullup: true

sensor:
  - platform: ntc
    id: temperature
    name: "Temperature"
    sensor: temp_resistance_reading
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 298.15K
    #icon: "mdi:thermometer"
  - platform: resistance
    id: temp_resistance_reading
    sensor: temp_analog_reading
    configuration: DOWNSTREAM
    resistor: 10kOhm
  - platform: adc
    id: temp_analog_reading
    pin: GPIO3
    attenuation: 12db

  - platform: bl0942
    uart_id: uart_0
    voltage:
      id: voltage
      name: "Voltage"
      #icon: mdi:alpha-v-circle-outline
      device_class: voltage
    current:
      id: current
      name: "Current"
      #icon: mdi:alpha-a-circle-outline
    power:
      name: "Power"
      id: power
      #icon: mdi:transmission-tower
    energy:
      id: energy
      name: "Energy"
      #icon: mdi:lightning-boltdevice class
    frequency:
      id: frequency
      name: "Frequency"
      accuracy_decimals: 2
      #icon: mdi:cosine-wave
    update_interval: 5s

status_led:
  pin:
    number: 0
    inverted: true
