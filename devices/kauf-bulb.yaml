light:
  - platform: rgbww
    name: "Bulb"
    id: kauf_light
    red: pwm_red
    green: pwm_green
    blue: pwm_blue
    cold_white: pwm_cw
    warm_white: pwm_ww
    cold_white_color_temperature: 6600 K
    warm_white_color_temperature: 2500 K
    restore_mode: RESTORE_DEFAULT_ON
