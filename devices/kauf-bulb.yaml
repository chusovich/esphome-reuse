esphome:
  comment: "Kauf ${kauf_bulb_model} Smart Bulb"

esp8266:
  board: esp07s
  restore_from_flash: true
  
logger:
  
output:
  - platform: esp8266_pwm
    pin: GPIO4
    frequency: 250 Hz
    id: pwm_red
    max_power: .9
  - platform: esp8266_pwm
    pin: GPIO12
    frequency: 250 Hz
    id: pwm_green
    max_power: .9
  - platform: esp8266_pwm
    pin: GPIO14
    frequency: 250 Hz
    id: pwm_blue
    max_power: .9
  - platform: esp8266_pwm
    pin: GPIO5
    frequency: 250 Hz
    id: pwm_cw
    max_power: .9
  - platform: esp8266_pwm
    pin: GPIO13
    frequency: 250 Hz
    id: pwm_ww
    max_power: .9

