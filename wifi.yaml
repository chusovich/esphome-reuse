# Wi-Fi
# https://esphome.io/components/wifi/
wifi:  
  networks:
    - ssid: ${wifi_ssid}
      password: ${wifi_password}
  fast_connect:
    enabled: true
    storage: flash
  min_auth_mode: WPA2
  
  # Fallback access point (no password)
  ap: {}

# Fallback Wi-Fi configuration portal
# https://esphome.io/components/captive_portal/
captive_portal:

# Wi-Fi diagnostics
sensor:
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: diagnostic

# Network information
text_sensor:
  - platform: wifi_info
    ssid:
      name: "Connected SSID"
    ip_address:
      name: "IP Address"
    dns_address:
      name: "DNS Address"
    mac_address:
      name: "MAC Address"
    bssid:
      name: "Connected BSSID"
