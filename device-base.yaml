# Home Assistant API
api:
  encryption:
    key: ${api_key}
  reboot_timeout: 15min

# OTA Updates
ota:
  - platform: esphome
    encryption:

# Web Server
web_server:
  version: 3
  port: 80
  auth:
    username: ${web_server_username}
    password: ${web_server_password}

# Prometheus Exporter
prometheus:

# Diagnostic Sensors
sensor:
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    update_interval: 60s
    entity_category: diagnostic

# Connectivity Status
binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

# Firmware Version
text_sensor:
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    entity_category: diagnostic
